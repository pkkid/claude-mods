<svg xmlns="http://www.w3.org/2000/svg" width="940" height="320" viewBox="0 0 940 320" role="img" aria-label="The Handoff brief">
<title>The Handoff brief</title>
<rect width="940" height="320" rx="12" fill="#262624"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="13" xml:space="preserve">
<rect x="20" y="20" width="900" height="280" rx="10" fill="#1f1e1d" stroke="#3d3c38"/><text x="36" y="46" fill="#ECEAE4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Handoff brief</text><text x="904" y="46" fill="#85837d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" text-anchor="end">×</text><line x1="20" x2="920" y1="60" y2="60" stroke="#3d3c38"/><text x="872.8" y="74" fill="#85837d" textLength="31.2" lengthAdjust="spacingAndGlyphs">Copy</text><text x="36" y="102" fill="#ECEAE4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Goal</text><text x="36" y="123" fill="#b0b0b0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">Add a dark mode to the settings page.</text><text x="36" y="154" fill="#ECEAE4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Current state</text><text x="36" y="175" fill="#b0b0b0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">Color tokens and the toggle are done; tests pass.</text><text x="36" y="206" fill="#ECEAE4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Decisions</text><text x="36" y="227" fill="#b0b0b0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">Follow the OS theme until the user picks one.</text><text x="36" y="258" fill="#ECEAE4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Next step</text><text x="36" y="279" fill="#b0b0b0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">Remember the choice across reloads.</text>
</g>
</svg>
